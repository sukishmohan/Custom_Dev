server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanager_db
    username: postgres
    password: YOUR_POSTGRES_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.example.taskmanager: DEBUG
    org.hibernate.SQL: DEBUG